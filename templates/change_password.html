<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b2130;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(440px,100%);background:white;border:1px solid #e2e6ee;border-radius:16px;padding:28px}h1{font-size:21px;margin:0 0 8px}.muted{color:#6b7385;font-size:13px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:11px;border:1px solid #d9dfeb;border-radius:8px;font:inherit}button{width:100%;margin-top:18px;padding:11px;background:#2f5bea;color:white;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.error,.success{border-radius:8px;padding:10px;font-size:13px;margin:12px 0}.error{background:#fdeaea;color:#a42323;border:1px solid #f0c3c3}.success{background:#eaf8f0;color:#176b42;border:1px solid #bde9ce}a{color:#2f5bea;text-decoration:none;font-size:13px}</style></head>
<body><main class="panel"><h1>Change password</h1><p class="muted">You must be signed in to change your password.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}{% if success %}<div class="success" role="status">{{ success }}</div>{% endif %}
<form method="post" action="{{ url_for('change_password') }}"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form>
<p><a href="{{ url_for('dashboard') }}">Back to dashboard</a> · <a href="{{ url_for('logout') }}">Log out</a></p></main></body></html>
