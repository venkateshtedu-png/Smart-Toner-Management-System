<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify code</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b2130;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(420px,100%);background:white;border:1px solid #e2e6ee;border-radius:16px;padding:28px}h1{font-size:21px;margin:0 0 8px}.muted{color:#6b7385;font-size:13px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:18px 0 6px}input{width:100%;padding:11px;border:1px solid #d9dfeb;border-radius:8px;font:inherit;letter-spacing:.15em}button{width:100%;margin-top:16px;padding:11px;background:#2f5bea;color:white;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.error{background:#fdeaea;color:#a42323;border:1px solid #f0c3c3;border-radius:8px;padding:10px;font-size:13px;margin:12px 0}a{color:#2f5bea;text-decoration:none;font-size:13px}</style></head>
<body><main class="panel"><h1>Verify code</h1><p class="muted">Enter the one-time code sent by the application. The code expires after 10 minutes.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('verify_otp') }}"><label for="otp">Verification code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button type="submit">Verify</button></form>
<p><a href="{{ url_for('forgot_password') }}">Start again</a></p></main></body></html>
